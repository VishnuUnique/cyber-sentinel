version: "3.9"

services:
  api:
    build: .
    command: uvicorn cyber_sentinel.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - db_data:/app/database
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
    environment:
      - DATABASE_URL=sqlite:////app/database/cyber_sentinel.db
      - LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  dashboard:
    build: .
    command: streamlit run src/cyber_sentinel/dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - db_data:/app/database
      - ./data:/app/data
      - ./models:/app/models
    environment:
      - DATABASE_URL=sqlite:////app/database/cyber_sentinel.db
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db_data:
