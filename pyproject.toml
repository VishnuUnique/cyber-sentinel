[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cyber-sentinel"
version = "1.0.0"
requires-python = ">=3.11"
description = "Intelligent Cyber Threat and Network Anomaly Detection Sentinel"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
cyber-sentinel = "cyber_sentinel.cli.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
